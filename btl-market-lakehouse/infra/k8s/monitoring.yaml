apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: market
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: market-api
        metrics_path: /metrics
        static_configs:
          - targets: ["market-api:8000"]
      - job_name: kafka
        static_configs:
          - targets: ["kafka:9308"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: market
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: market
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: market
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_INSTALL_PLUGINS
              value: yesoreyeram-infinity-datasource
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: market
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
