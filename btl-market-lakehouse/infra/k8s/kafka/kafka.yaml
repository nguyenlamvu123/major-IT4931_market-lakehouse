# Strimzi Kafka cluster "market" in namespace kafka (PDF: "Strimzi, cụm tên market").
# Bootstrap for every client: market-kafka-bootstrap.kafka.svc:9092 (contracts/infra.yaml).
#
# Dev (minikube on one laptop): 1 combined controller+broker node, replication 1.
# Demo (PDF idea deck, slide "Hạ tầng"): set KafkaNodePool replicas: 3 and the
# replication/ISR settings below to 3/2, then regenerate topics with
#   python -m infra.scripts.gen_kafka_topics --replicas 3 --min-insync 2
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: market
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: false
        # KRaft metadata shares the data volume; one disk is enough on minikube.
        kraftMetadata: shared
  resources:
    requests:
      memory: 1Gi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: "1"
  jvmOptions:
    -Xms: 512m
    -Xmx: 1g
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: market
  namespace: kafka
  annotations:
    # KRaft mode with node pools (no ZooKeeper), required for Strimzi >= 0.46 anyway.
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.7.1
    metadataVersion: 3.7-IV4
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Topics come only from KafkaTopic CRs generated from contracts/topics.yaml.
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # kafka_consumergroup_lag / kafka_topic_partition_current_offset for the monitoring
  # dashboard (PDF D.5: "Kafka lag"). Scraped by the PodMonitor in monitoring/.
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m
