apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-api
  namespace: market
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-api
  template:
    metadata:
      labels:
        app: market-api
    spec:
      containers:
        - name: market-api
          image: btl/market-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: CASSANDRA_HOSTS
              value: cassandra
            - name: CASSANDRA_KEYSPACE
              value: market
            - name: DEMO_DATA_DIR
              value: /app/data/demo
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: market-api
  namespace: market
spec:
  selector:
    app: market-api
  ports:
    - port: 8000
      targetPort: 8000
