# Light dev stack for laptops (PDF, việc D.4): Kafka + MinIO + Cassandra only.
#
#   docker compose -f infra/docker-compose.dev.yml up -d   # also creates buckets + CQL schema
#   bash infra/scripts/init-topics.sh                      # topics from contracts/topics.yaml
#
# Addresses (contracts/infra.yaml, dev column):
#   Kafka     host localhost:9092   | inside this network kafka:29092
#   MinIO     http://localhost:9000 (console :9001) | http://minio:9000
#   Cassandra localhost:9042        | cassandra:9042
name: btl-market-dev

x-minio-credentials: &minio-credentials
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

services:
  kafka:
    # NOTICE:
    # Bitnami moved its free images to bitnamilegacy/ in 2025, so bitnami/kafka tags stop
    # receiving updates and may disappear. The Apache project image is official, multi-arch
    # (linux/arm64 for the Mac M1 host) and configured via KAFKA_* environment variables.
    # Removal condition: none, this is the supported image.
    image: apache/kafka:3.7.1
    container_name: btl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two client listeners: PLAINTEXT_HOST is what laptops (producers, spark-submit on the
      # host) reach as localhost:9092; PLAINTEXT is used by containers (Kafka Connect, init).
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # NOTICE:
      # No named volume for Kafka in dev. The image runs as a non-root user and a fresh named
      # volume is created root-owned, which makes the broker fail on first start. Kafka is
      # only a buffer here (raw data is kept in MinIO bronze); `make topics` recreates topics
      # after `down`. Removal condition: switch to a bind mount with a chown init step if
      # the team needs Kafka data to survive restarts.
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Single broker: internal topics cannot use the default replication factor 3.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics exist only if declared in contracts/topics.yaml (init-topics.sh). A typo in a
      # producer then fails loudly instead of silently creating "stock.trades".
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - market

  minio:
    # NOTICE:
    # MinIO stopped publishing community Docker images in late 2025; existing tags remain
    # pullable. Pin a release instead of :latest so every laptop runs the same server.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: btl-minio
    command: server /data --console-address ":9001"
    environment: *minio-credentials
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - market

  minio-init:
    image: minio/mc:latest
    container_name: btl-minio-init
    depends_on:
      - minio
    environment: *minio-credentials
    # One-shot: retries until the server answers, then creates the contract buckets
    # (contracts/paths.yaml) and exits 0. Safe to re-run (--ignore-existing).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "waiting for minio..."; sleep 2;
        done
        mc mb --ignore-existing local/lake local/checkpoints
        mc ls local
    restart: "no"
    networks:
      - market

  cassandra:
    image: cassandra:4.1
    container_name: btl-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: market
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
    networks:
      - market

  cassandra-init:
    image: cassandra:4.1
    container_name: btl-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    # The schema is applied straight from the contract file; there is no second copy of the
    # CQL anywhere in infra/.
    volumes:
      - ../contracts:/contracts:ro
    entrypoint: ["cqlsh", "cassandra", "-f", "/contracts/cassandra.cql"]
    restart: "no"
    networks:
      - market

volumes:
  minio_data:
  cassandra_data:

networks:
  market:
    driver: bridge
