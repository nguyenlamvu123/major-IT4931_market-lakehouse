# Full single-machine stack (~12-16 GB RAM): the dev stack (Kafka, MinIO, Cassandra and
# their init jobs) plus Kafka Connect, Spark standalone, Airflow UI, market-api,
# kafka-exporter, Prometheus and Grafana. The reference deployment is Kubernetes
# (`make up`); this file is for machines without minikube.
#
#   make images-local    # builds btl/market-api:dev, btl/airflow:dev, btl/kafka-connect-s3:dev
#   docker compose -f infra/docker-compose.full.yml up -d
#   bash infra/scripts/init-topics.sh
name: btl-market-full

include:
  # Kafka, MinIO (+ bucket init), Cassandra (+ schema init) come from the dev stack so the
  # two files can never drift apart.
  - docker-compose.dev.yml

services:
  kafka-connect:
    # Built from role A's Connect Dockerfile (Confluent S3 sink plugin baked in); the stock
    # cp-kafka-connect image has no S3 plugin. Register the sink afterwards with role A's
    # ingest/kafka_connect/register_connector.sh.
    image: btl/kafka-connect-s3:dev
    container_name: btl-full-connect
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: market-connect
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      # The S3 sink reads AWS_* credentials; MinIO accepts its root user as an access key.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - market

  kafka-exporter:
    # Exposes kafka_consumergroup_lag (Kafka Connect group connect-s3-sink-bronze), the
    # same series Strimzi's kafkaExporter serves on Kubernetes.
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: btl-full-kafka-exporter
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    networks:
      - market

  spark-master:
    image: apache/spark:3.5.3
    container_name: btl-full-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes: &spark-code
      - ../streaming:/opt/app/streaming:ro
      - ../batch:/opt/app/batch:ro
      - ../common:/opt/app/common:ro
      - ../contracts:/opt/app/contracts:ro
    networks:
      - market

  spark-worker:
    image: apache/spark:3.5.3
    container_name: btl-full-spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
    depends_on:
      - spark-master
    volumes: *spark-code
    networks:
      - market

  postgres:
    image: postgres:15
    container_name: btl-full-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - market

  airflow:
    # Same image as Kubernetes (infra/airflow/Dockerfile). The DAG submits SparkApplications
    # to Kubernetes, so here Airflow is only for browsing/validating the DAG; nightly runs
    # happen on the cluster (`make up`).
    image: btl/airflow:dev
    container_name: btl-full-airflow
    command: standalone
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8081:8080"
    networks:
      - market

  market-api:
    image: btl/market-api:dev
    container_name: btl-full-market-api
    environment:
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: market
      # Local stacks may show synthetic data while Cassandra is still empty; every response
      # says so in the X-Data-Source header. Kubernetes sets this to false.
      DEMO_FALLBACK: "true"
    ports:
      - "8000:8000"
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    networks:
      - market

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: btl-full-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Producers (:8001) and the streaming driver (:9108) usually run on the host during
    # development; host.docker.internal lets Prometheus scrape them.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - market-api
      - kafka-exporter
    networks:
      - market

  grafana:
    image: grafana/grafana:11.1.0
    container_name: btl-full-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - market

volumes:
  postgres_data:
  grafana_data:
