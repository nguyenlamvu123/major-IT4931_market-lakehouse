name: btl-market-full

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: btl-full-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - market

  minio:
    image: minio/minio:latest
    container_name: btl-full-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - market

  cassandra:
    image: cassandra:4.1
    container_name: btl-full-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: market
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 768M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ../contracts:/contracts:ro
    networks:
      - market

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.1
    container_name: btl-full-connect
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    networks:
      - market

  spark-master:
    image: bitnami/spark:3.5
    container_name: btl-full-spark-master
    command: bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MODE: master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ../streaming:/opt/app/streaming:ro
      - ../batch:/opt/app/batch:ro
      - ../common:/opt/app/common:ro
      - ../contracts:/opt/app/contracts:ro
    networks:
      - market

  spark-worker:
    image: bitnami/spark:3.5
    container_name: btl-full-spark-worker
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ../streaming:/opt/app/streaming:ro
      - ../batch:/opt/app/batch:ro
      - ../common:/opt/app/common:ro
      - ../contracts:/opt/app/contracts:ro
    networks:
      - market

  postgres:
    image: postgres:15
    container_name: btl-full-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - market

  airflow:
    image: apache/airflow:2.9.2
    container_name: btl-full-airflow
    command: standalone
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-apache-spark
    ports:
      - "8081:8080"
    volumes:
      - ../batch/dags:/opt/airflow/dags:ro
      - ../batch:/opt/app/batch:ro
      - ../common:/opt/app/common:ro
      - ../contracts:/opt/app/contracts:ro
    networks:
      - market

  market-api:
    image: btl/market-api:latest
    container_name: btl-full-market-api
    environment:
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_KEYSPACE: market
      DEMO_DATA_DIR: /app/data/demo
    ports:
      - "8000:8000"
    depends_on:
      - cassandra
    networks:
      - market

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: btl-full-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - market-api
    networks:
      - market

  grafana:
    image: grafana/grafana:11.1.0
    container_name: btl-full-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - market

volumes:
  kafka_data:
  minio_data:
  cassandra_data:
  postgres_data:
  grafana_data:

networks:
  market:
    driver: bridge
