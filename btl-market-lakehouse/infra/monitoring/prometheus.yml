global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: market-api
    metrics_path: /metrics
    static_configs:
      - targets: ["market-api:8000"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9308"]

  - job_name: spark-master
    metrics_path: /metrics
    static_configs:
      - targets: ["spark-master:8080"]
