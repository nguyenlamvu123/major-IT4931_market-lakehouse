# Prometheus scrape config for the Docker Compose full stack.
# On Kubernetes the same targets are discovered by kube-prometheus-stack through
# ServiceMonitor/PodMonitor objects (infra/k8s/monitoring/).
# Metric names are fixed in contracts/infra.yaml ("metrics").
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: market-api
    metrics_path: /metrics
    static_configs:
      - targets: ["market-api:8000"]

  # kafka_consumergroup_lag, kafka_topic_partition_current_offset
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Role A producers (market_producer_*) when started on the host with --metrics-port 8001.
  - job_name: producers
    static_configs:
      - targets: ["host.docker.internal:8001"]

  # Role B streaming driver (market_speed_*) when spark-submit runs on the host.
  - job_name: speed-layer
    static_configs:
      - targets: ["host.docker.internal:9108"]
