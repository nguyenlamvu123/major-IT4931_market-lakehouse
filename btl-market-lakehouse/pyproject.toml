[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "ingest/tests", "streaming/tests", "batch/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
