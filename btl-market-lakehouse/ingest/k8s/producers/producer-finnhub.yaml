# Finnhub trade websocket: backup feed for stocks.trades, off by default.
# Scale to 1 (and producer-alpaca to 0) if Alpaca is unavailable; needs FINNHUB_API_KEY.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-finnhub
  namespace: market
  labels:
    app.kubernetes.io/part-of: btl-market-lakehouse
    app.kubernetes.io/component: producer
    app.kubernetes.io/name: producer-finnhub
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: producer-finnhub
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: btl-market-lakehouse
        app.kubernetes.io/component: producer
        app.kubernetes.io/name: producer-finnhub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
      - name: producer
        image: btl/ingest:dev
        imagePullPolicy: IfNotPresent
        args:
        - --source
        - finnhub
        envFrom:
        - configMapRef:
            name: ingest-config
        - secretRef:
            name: market-api-keys
            optional: true
        env:
        - name: PRODUCER_NAME
          value: producer-finnhub
        ports:
        - name: metrics
          containerPort: 8001
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
