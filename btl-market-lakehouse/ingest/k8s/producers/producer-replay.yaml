# Daytime demo (US market closed in Vietnam daytime): replays a stored session at 10x
# with fresh timestamps. Scale to 1 for the demo:
#   kubectl -n market set env deploy/producer-replay \
#     REPLAY_S3_URI=s3://lake/bronze/stocks.trades/dt=2026-11-10/
#   kubectl -n market scale deploy/producer-replay --replicas=1
# Empty REPLAY_S3_URI falls back to the synthetic contract samples baked in the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-replay
  namespace: market
  labels:
    app.kubernetes.io/part-of: btl-market-lakehouse
    app.kubernetes.io/component: producer
    app.kubernetes.io/name: producer-replay
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: producer-replay
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: btl-market-lakehouse
        app.kubernetes.io/component: producer
        app.kubernetes.io/name: producer-replay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
      - name: producer
        image: btl/ingest:dev
        imagePullPolicy: IfNotPresent
        args:
        - --source
        - replay
        - --speed
        - $(REPLAY_SPEED)
        - --rebase-time
        - --loop
        - --s3-uri
        - $(REPLAY_S3_URI)
        - --file
        - contracts/samples
        envFrom:
        - configMapRef:
            name: ingest-config
        - secretRef:
            name: market-api-keys
            optional: true
        env:
        - name: PRODUCER_NAME
          value: producer-replay
        - name: REPLAY_S3_URI
          value: ''
        # Read through $(REPLAY_SPEED) in args so `kubectl set env REPLAY_SPEED=100`
        # (infra/fault_injection/k8s/flood_replay.sh, D) changes the speed on rollout.
        - name: REPLAY_SPEED
          value: '10'
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_ACCESS_KEY
              optional: true
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_SECRET_KEY
              optional: true
        ports:
        - name: metrics
          containerPort: 8001
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
