# One-off: 3 years of yfinance daily bars for every registry symbol -> stocks.bars
# (needed by the 90-day correlation before live data accumulates). Idempotent (bar_id).
# Re-run: kubectl -n market delete job producer-backfill && kubectl apply -k ingest/k8s/producers
apiVersion: batch/v1
kind: Job
metadata:
  name: producer-backfill
  namespace: market
  labels:
    app.kubernetes.io/part-of: btl-market-lakehouse
    app.kubernetes.io/component: producer
    app.kubernetes.io/name: producer-backfill
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: btl-market-lakehouse
        app.kubernetes.io/component: producer
        app.kubernetes.io/name: producer-backfill
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
      - name: producer
        image: btl/ingest:dev
        imagePullPolicy: IfNotPresent
        args:
        - --source
        - backfill
        - --years
        - '3'
        envFrom:
        - configMapRef:
            name: ingest-config
        - secretRef:
            name: market-api-keys
            optional: true
        env:
        - name: PRODUCER_NAME
          value: producer-backfill
        ports:
        - name: metrics
          containerPort: 8001
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: OnFailure
