# Treasury daily yield CSV (nominal 1M..30Y + real 10Y) -> rates.yields. No key.
# Deployment polling hourly rather than a CronJob: the publish-once-per-day state, the
# circuit breaker and the /metrics endpoint stay alive between polls, so Prometheus
# can alert when the feed stalls; a CronJob pod would exist for seconds per day.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-rates-treasury
  namespace: market
  labels:
    app.kubernetes.io/part-of: btl-market-lakehouse
    app.kubernetes.io/component: producer
    app.kubernetes.io/name: producer-rates-treasury
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: producer-rates-treasury
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: btl-market-lakehouse
        app.kubernetes.io/component: producer
        app.kubernetes.io/name: producer-rates-treasury
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
      - name: producer
        image: btl/ingest:dev
        imagePullPolicy: IfNotPresent
        args:
        - --source
        - treasury
        - --interval
        - '3600'
        envFrom:
        - configMapRef:
            name: ingest-config
        - secretRef:
            name: market-api-keys
            optional: true
        env:
        - name: PRODUCER_NAME
          value: producer-rates-treasury
        ports:
        - name: metrics
          containerPort: 8001
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
